name: Discord pull request notifications

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only run trusted default-branch code; never check out the PR head.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # This job runs a dependency-free Node script; pnpm is not installed.
          package-manager-cache: false
      - name: Send pull request notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/notify-discord.mjs

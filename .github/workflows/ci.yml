name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-test-coverage
          path: |
            apps/*/coverage/
            packages/*/coverage/
          if-no-files-found: warn
  web-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared web dependencies
        run: pnpm --filter @project-tracker/web^... run build
      - name: Install Chromium and system dependencies
        run: pnpm --filter @project-tracker/web exec playwright install --with-deps chromium
      - name: Test web workflows and responsive layouts
        run: pnpm test:e2e
      - name: Upload browser reports, screenshots, and traces
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: web-browser-test-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: warn
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Testcontainers owns the database; do not start the development Compose stack.
      - run: pnpm --filter @project-tracker/database run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-coverage
          path: packages/database/coverage/
          if-no-files-found: warn

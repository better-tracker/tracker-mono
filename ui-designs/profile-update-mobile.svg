<text x="40" y="1154" font-size="14" class="label" text-anchor="start" style="fill:#0A0A0A">WEEK STARTS ON</text>
<rect x="40" y="1168" width="358" height="56" fill="#FCFCFA" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="56" y="1202.0" font-size="19" class="body" text-anchor="start" style="fill:#0A0A0A">Monday</text>
<path d="M 366 1193.0 l 7 7 l 7 -7" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>

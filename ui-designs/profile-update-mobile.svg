<rect x="40" y="270" width="90" height="90" fill="#BAEAF3"/>
<text x="85" y="332" font-size="46" class="display" text-anchor="middle" style="fill:#0A0A0A">BM</text>
<text x="150" y="302" font-size="26" class="body" text-anchor="start" style="fill:#0A0A0A">Ben Morgan</text>
<rect x="150" y="318" width="248" height="48" fill="#FCFCFA" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="274.0" y="347.0" font-size="12" class="label" text-anchor="middle" style="fill:#0A0A0A">EDIT AVATAR ↗</text>
<text x="40" y="416" font-size="13" class="label" text-anchor="start" style="fill:#0A0A0A">01 / PERSONAL DETAILS</text>
<text x="40" y="458" font-size="14" class="label" text-anchor="start" style="fill:#0A0A0A">FIRST NAME *</text>
<rect x="40" y="472" width="358" height="56" fill="#FCFCFA" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="56" y="506.0" font-size="19" class="body" text-anchor="start" style="fill:#0A0A0A">Ben</text>
<text x="40" y="574" font-size="14" class="label" text-anchor="start" style="fill:#0A0A0A">LAST NAME *</text>
<rect x="40" y="588" width="358" height="56" fill="#FCFCFA" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="56" y="622.0" font-size="19" class="body" text-anchor="start" style="fill:#0A0A0A">Morgan</text>
<text x="40" y="690" font-size="14" class="label" text-anchor="start" style="fill:#0A0A0A">EMAIL ADDRESS *</text>
<rect x="40" y="704" width="358" height="56" fill="#FCFCFA" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="56" y="738.0" font-size="19" class="body" text-anchor="start" style="fill:#0A0A0A">ben@example.com</text>
<text x="40" y="788" font-size="16" class="body" text-anchor="start" style="fill:#595955">Used for sign-in and account updates.</text>
<text x="40" y="834" font-size="14" class="label" text-anchor="start" style="fill:#0A0A0A">BIO</text>
<rect x="40" y="848" width="358" height="90" fill="#FCFCFA" stroke="#0A0A0A" stroke-width="1.5"/>
<text x="56" y="880" font-size="19" class="body" text-anchor="start" style="fill:#0A0A0A">Building useful things,</text>
<text x="56" y="906" font-size="18" class="body" text-anchor="start" style="fill:#0A0A0A">one small task at a time.</text>
<text x="40" y="978" font-size="13" class="label" text-anchor="start" style="fill:#0A0A0A">02 / PREFERENCES</text>

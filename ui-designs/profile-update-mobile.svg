<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1670" viewBox="0 0 430 1670" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — mobile profile update</title>
<desc id="desc">Single-column mobile account profile editor. Avatar, labeled personal fields, timezone and notification preferences lead to save and cancel actions. Bottom navigation indicates the current profile section.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#0A0A0A}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>
<rect x="0" y="0" width="430" height="1670" fill="#0A0A0A"/>
<rect x="4" y="12" width="2" height="1646" fill="#FCFCFA"/>
<rect x="9" y="12" width="3" height="174" fill="#FCFCFA"/>
<rect x="14" y="12" width="2" height="1646" fill="#FCFCFA"/>
<rect x="9" y="340" width="3" height="1316" fill="#FCFCFA"/>
<rect x="18" y="10" width="402" height="1650" fill="#FCFCFA"/>
<text x="40" y="43" font-size="13" class="label" text-anchor="start" style="fill:#0A0A0A">PROJECT TRACKER</text>
<text x="398" y="43" font-size="13" class="label" text-anchor="end" style="fill:#0A0A0A">BM</text>
<line x1="40" y1="61" x2="398" y2="61" stroke="#0A0A0A" stroke-width="2"/>
<text x="40" y="98" font-size="13" class="label" text-anchor="start" style="fill:#0A0A0A">← TODAY</text>
<text x="38" y="165" font-size="60" class="display" text-anchor="start" style="fill:#0A0A0A">PROFILE.</text>
<text x="40" y="201" font-size="13" class="label" text-anchor="start" style="fill:#0A0A0A">ACCOUNT / YOUR DETAILS</text>

<rect x="18" y="1568" width="402" height="92" fill="#FCFCFA"/>
<line x1="40" y1="1568" x2="398" y2="1568" stroke="#0A0A0A" stroke-width="2"/>
<text x="84.75" y="1613" font-size="11.5" class="label" text-anchor="middle" style="fill:#0A0A0A">TODAY</text>
<text x="174.25" y="1613" font-size="11.5" class="label" text-anchor="middle" style="fill:#0A0A0A">PROJECTS</text>
<text x="263.75" y="1613" font-size="11.5" class="label" text-anchor="middle" style="fill:#0A0A0A">TASKS</text>
<rect x="308.5" y="1580" width="89.5" height="56" fill="#0A0A0A"/>
<text x="353.25" y="1613" font-size="11.5" class="label" text-anchor="middle" style="fill:#FCFCFA">PROFILE</text>

<path d="M 45 1276 l 5 5 l 8 -10" fill="none" stroke="#FCFCFA" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="76" y="1281" font-size="18" class="body" text-anchor="start" style="fill:#0A0A0A">Task assignment emails</text>
<rect x="40" y="1320" width="22" height="22" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5"/>
<path d="M 45 1331 l 5 5 l 8 -10" fill="none" stroke="#FCFCFA" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="76" y="1336" font-size="18" class="body" text-anchor="start" style="fill:#0A0A0A">Daily deadline summary</text>
<rect x="40" y="1390" width="358" height="60" fill="#DFFF00" stroke="#0A0A0A" stroke-width="1.5"/>

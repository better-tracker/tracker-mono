<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — bold functional login-web</title>
<desc id="desc">Centered full-screen login with black text, labeled fields and no decorative left rail. Functional palette sampled from the provided reference: Dawn urgent/overdue, Greenery complete, Sea in progress, Sand next deadline. Login and profile are monochrome. Colours never style generic actions or decorative form sections. Oversized bold Helvetica Neue headlines, editorial chapter numbers, heavy horizontal black divider bands, stronger borders and restrained hard-offset primary actions. The rail-free layout and task-only colour semantics remain.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#000000}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>
<rect x="0" y="0" width="1440" height="1230" fill="#FCFCFA" />
<g id="functional-task-states" /><text x="56" y="49" font-size="14" class="label" text-anchor="start" fill="#000000" font-weight="600" letter-spacing="0.84" style="font-weight:600;letter-spacing:0.84px">PROJECT TRACKER</text>
<text x="1384" y="49" font-size="13.0" class="label" text-anchor="end" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">001</text>
<line x1="56" y1="78" x2="1384" y2="78" stroke="#000000" stroke-width="3" />
<text x="720" y="149" font-size="13.0" class="label" text-anchor="middle" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">01 / YOUR ACCOUNT</text>
<text x="720" y="260" font-size="144" class="display" text-anchor="middle" fill="#000000" font-weight="600" style="font-weight:600">WELCOME</text>
<text x="720" y="386" font-size="144" class="display" font-weight="600" text-anchor="middle" fill="#000000" style="font-weight:600">BACK.</text><text x="720" y="431.0" font-size="23" class="body" text-anchor="middle" fill="#000000">Your work, in order. Sign in to find your next step.</text>
<rect id="editorial-divider" x="430.0" y="476" width="580.0" height="18" fill="#000000" /><text x="430" y="532.0" font-size="13.0" class="label" text-anchor="start" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">EMAIL ADDRESS</text>
<rect x="430" y="548.0" width="580" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="2" />
<text x="446" y="579.0" font-size="18" class="body" text-anchor="start" fill="#000000">ben@example.com</text>
<text x="430" y="645.0" font-size="13.0" class="label" text-anchor="start" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">PASSWORD</text>
<rect x="430" y="661.0" width="580" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="2" />
<text x="446" y="692.0" font-size="18" class="body" text-anchor="start" fill="#000000">••••••••••••</text>
<rect x="909" y="663.0" width="99" height="52" fill="#FCFCFA" stroke="#000000" stroke-width="2" />
<text x="958.5" y="694.0" font-size="14" class="label" text-anchor="middle" fill="#000000" font-weight="600" letter-spacing="0.84" style="font-weight:600;letter-spacing:0.84px">SHOW</text>
<rect x="430" y="743.0" width="22" height="22" fill="#FCFCFA" stroke="#000000" stroke-width="2" />
<text x="466" y="760.0" font-size="18" class="body" text-anchor="start" fill="#000000">Keep me signed in</text>
<text x="1010" y="760.0" font-size="18" class="body" text-anchor="end" fill="#000000">Forgot password?</text>
<line x1="862" y1="768.0" x2="1010" y2="768.0" stroke="#000000" stroke-width="1.25" />
<rect id="primary-action-offset" x="434.0" y="819.0" width="580" height="64" fill="#000000" /><rect x="430" y="815.0" width="580" height="64" fill="#FCFCFA" stroke="#000000" stroke-width="3.5" />
<text x="720.0" y="852.0" font-size="14" class="label" text-anchor="middle" fill="#000000" font-weight="600" letter-spacing="0.84" style="font-weight:600;letter-spacing:0.84px">SIGN IN →</text>
<text x="720" y="932.0" font-size="20" class="body" text-anchor="middle" fill="#000000">New here? Create account ↗</text>
<line x1="56" y1="1021.0" x2="1384" y2="1021.0" stroke="#000000" stroke-width="3" />
<text x="56" y="1070.0" font-size="13.0" class="label" text-anchor="start" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">01</text>
<text x="100" y="1070.0" font-size="22" class="body" text-anchor="start" fill="#000000">Find what matters.</text>
<text x="522" y="1070.0" font-size="13.0" class="label" text-anchor="start" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">02</text>
<text x="566" y="1070.0" font-size="22" class="body" text-anchor="start" fill="#000000">Break it into steps.</text>
<text x="988" y="1070.0" font-size="13.0" class="label" text-anchor="start" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">03</text>
<text x="1032" y="1070.0" font-size="22" class="body" text-anchor="start" fill="#000000">Move work forward.</text>
<line x1="56" y1="1155.0" x2="1384" y2="1155.0" stroke="#000000" stroke-width="3" />
<text x="56" y="1189.0" font-size="13.0" class="label" text-anchor="start" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">ACCOUNT / SIGN IN</text>
<text x="1384" y="1189.0" font-size="13.0" class="label" text-anchor="end" fill="#000000" font-weight="600" letter-spacing="0.78" style="font-weight:600;letter-spacing:0.78px">PLAN SMALL. FINISH WELL.</text>
</svg>
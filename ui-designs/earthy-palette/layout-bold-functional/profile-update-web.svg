<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1372" viewBox="0 0 1440 1372" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — bold functional profile-update-web</title>
<desc id="desc">Horizontal identity header and grouped personal details and preferences. Persistent field labels, explicit save and no left rail. Functional palette sampled from the provided reference: Dawn urgent/overdue, Greenery complete, Sea in progress, Sand next deadline. Login and profile are monochrome. Colours never style generic actions or decorative form sections. Oversized bold Helvetica Neue headlines, editorial chapter numbers, heavy horizontal black divider bands, stronger borders and restrained hard-offset primary actions. The rail-free layout and task-only colour semantics remain.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#000000}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>

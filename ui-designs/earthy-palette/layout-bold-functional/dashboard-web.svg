<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1332" viewBox="0 0 1440 1332" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — bold functional dashboard-web</title>
<desc id="desc">Next deadline leads the layout; overdue tasks and a deadline-ordered task list follow. Status is conveyed with words and sparse colour markers; no left rail. Functional palette sampled from the provided reference: Dawn urgent/overdue, Greenery complete, Sea in progress, Sand next deadline. Login and profile are monochrome. Colours never style generic actions or decorative form sections. Oversized bold Helvetica Neue headlines, editorial chapter numbers, heavy horizontal black divider bands, stronger borders and restrained hard-offset primary actions. The rail-free layout and task-only colour semantics remain.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#000000}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>

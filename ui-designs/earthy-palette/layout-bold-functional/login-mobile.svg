<text x="366" y="42" font-size="12" class="label" text-anchor="end" fill="#000000" font-weight="600" letter-spacing="0.72" style="font-weight:600;letter-spacing:0.72px">001</text>
<line x1="24" y1="64" x2="366" y2="64" stroke="#000000" stroke-width="3" />
<text x="24" y="116" font-size="11.5" class="label" text-anchor="start" fill="#000000" font-weight="600" letter-spacing="0.69" style="font-weight:600;letter-spacing:0.69px">01 / YOUR ACCOUNT</text>

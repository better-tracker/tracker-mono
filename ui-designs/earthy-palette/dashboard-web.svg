<title id="title">Project Tracker — web today dashboard — minimal brutalist palette</title>
<desc id="desc">A today-first dashboard for Tuesday 6 October 2026. Two overdue tasks appear above a three-item deadline ledger. The right column highlights the next task with subtasks and shows project progress. Counts are illustrative. Black text and neutral surfaces throughout. Terracotta marks urgency, sage marks completion, slate blue marks work in progress, and a small mustard marker identifies the next-task section. No decorative colour fills.</desc>

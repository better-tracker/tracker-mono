<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — minimal colour system — minimal brutalist palette</title>
<desc id="desc">The four approved accent colours are shown as small markers beside black labels. Examples demonstrate urgent, complete, in-progress and next-task states. All interface text is black; large surfaces stay neutral. Black text and neutral surfaces throughout. Terracotta marks urgency, sage marks completion, slate blue marks work in progress, and a small mustard marker identifies the next-task section. No decorative colour fills.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#000000}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>

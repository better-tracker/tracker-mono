<rect x="53" y="668" width="6" height="422" fill="#FCFCFA"/>
<rect x="64" y="18" width="1518" height="1074" fill="#FCFCFA"/>
<text x="104" y="57" font-size="14" class="label" text-anchor="start" style="fill:#000000">PROJECT TRACKER / 001</text>
<text x="1540" y="57" font-size="14" class="label" text-anchor="end" style="fill:#000000">YOUR WORK. IN ORDER.</text>
<line x1="104" y1="78" x2="1540" y2="78" stroke="#000000" stroke-width="2"/>
<text x="96" y="198" font-size="116" class="display" text-anchor="start" style="fill:#000000">LESS COLOUR.</text>
<text x="104" y="235" font-size="14" class="label" text-anchor="start" style="fill:#000000">DESIGN SYSTEM / MINIMAL &amp; BRUTALIST / BLACK TYPE</text>
<rect x="104" y="260" width="1436" height="22" fill="#000000"/>
<text x="104" y="328" font-size="13" class="label" text-anchor="start" style="fill:#000000">COLOUR</text>
<text x="480" y="328" font-size="13" class="label" text-anchor="start" style="fill:#000000">HEX</text>
<text x="714" y="328" font-size="13" class="label" text-anchor="start" style="fill:#000000">USE</text>
<text x="1140" y="328" font-size="13" class="label" text-anchor="start" style="fill:#000000">UI EXAMPLE</text>
<line x1="104" y1="345" x2="1540" y2="345" stroke="#000000" stroke-width="2"/>
<rect x="104" y="388" width="12" height="12" fill="#E07A47"/>
<text x="140" y="407" font-size="29" class="display" text-anchor="start" style="fill:#000000">Terracotta</text>
<text x="480" y="405" font-size="17" class="label" text-anchor="start" style="fill:#000000">#E07A47</text>
<text x="714" y="405" font-size="20" class="body" text-anchor="start" style="fill:#000000">Urgent / overdue / important</text>
<rect x="1140" y="378" width="390" height="46" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>

<rect x="104" y="772" width="12" height="12" fill="#D4A72C"/>
<text x="140" y="791" font-size="29" class="display" text-anchor="start" style="fill:#000000">Mustard</text>
<text x="480" y="789" font-size="17" class="label" text-anchor="start" style="fill:#000000">#D4A72C</text>
<text x="714" y="789" font-size="20" class="body" text-anchor="start" style="fill:#000000">Small supporting indicators</text>
<rect x="1140" y="774" width="24" height="4" fill="#D4A72C"/>
<text x="1182" y="787" font-size="14" class="label" text-anchor="start" style="fill:#000000">NEXT TASK</text>
<line x1="104" y1="848" x2="1540" y2="848" stroke="#E3E3DF" stroke-width="1"/>
<line x1="104" y1="916" x2="1540" y2="916" stroke="#000000" stroke-width="2"/>
<text x="104" y="953" font-size="31" class="display" text-anchor="start" style="fill:#000000">THE DEFAULT IS NEUTRAL.</text>
<text x="104" y="992" font-size="21" class="body" text-anchor="start" style="fill:#000000">Black text. Hard edges. Strong rules. Colour only when it communicates a useful state.</text>
<line x1="104" y1="1040" x2="1540" y2="1040" stroke="#000000" stroke-width="2"/>
<text x="104" y="1072" font-size="13" class="label" text-anchor="start" style="fill:#000000">DESIGN SYSTEM / 04 FUNCTIONAL ACCENTS</text>
<text x="1540" y="1072" font-size="13" class="label" text-anchor="end" style="fill:#000000">COLOUR MARKERS / NO COLOURED TEXT</text>
</svg>

<rect x="104" y="516" width="12" height="12" fill="#8FA68F"/>
<text x="140" y="535" font-size="29" class="display" text-anchor="start" style="fill:#000000">Sage Green</text>
<text x="480" y="533" font-size="17" class="label" text-anchor="start" style="fill:#000000">#8FA68F</text>

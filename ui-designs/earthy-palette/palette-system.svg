<text x="104" y="962" font-size="14" class="label" text-anchor="start" style="fill:#252728">CONTRAST FIRST</text>
<text x="354" y="962" font-size="19" class="body" text-anchor="start" style="fill:#252728">Cream on teal and plum. Charcoal on warm accents. White on slate blue for small text.</text>
<text x="104" y="996" font-size="19" class="body" text-anchor="start" style="fill:#252728">Colour supports hierarchy; every deadline and status also has a written label.</text>
<line x1="104" y1="1030" x2="1540" y2="1030" stroke="#252728" stroke-width="2"/>

<text x="468" y="527" font-size="18" class="body" text-anchor="start" style="fill:#252728">In-progress status labels</text>
<text x="468" y="556" font-size="12" class="label" text-anchor="start" style="fill:#4E5650">02 / FUNCTIONAL COLOUR</text>

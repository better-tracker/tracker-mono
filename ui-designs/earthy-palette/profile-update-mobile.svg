<text x="40" y="458" font-size="14" class="label" text-anchor="start" style="fill:#252728">FIRST NAME *</text>
<rect x="40" y="472" width="358" height="56" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="56" y="506.0" font-size="19" class="body" text-anchor="start" style="fill:#252728">Ben</text>
<text x="40" y="574" font-size="14" class="label" text-anchor="start" style="fill:#252728">LAST NAME *</text>
<rect x="40" y="588" width="358" height="56" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="56" y="622.0" font-size="19" class="body" text-anchor="start" style="fill:#252728">Morgan</text>
<text x="40" y="690" font-size="14" class="label" text-anchor="start" style="fill:#252728">EMAIL ADDRESS *</text>
<rect x="40" y="704" width="358" height="56" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="56" y="738.0" font-size="19" class="body" text-anchor="start" style="fill:#252728">ben@example.com</text>
<text x="40" y="788" font-size="16" class="body" text-anchor="start" style="fill:#4E5650">Used for sign-in and account updates.</text>
<text x="40" y="834" font-size="14" class="label" text-anchor="start" style="fill:#252728">BIO</text>
<rect x="40" y="848" width="358" height="90" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="56" y="880" font-size="19" class="body" text-anchor="start" style="fill:#252728">Building useful things,</text>
<text x="56" y="906" font-size="18" class="body" text-anchor="start" style="fill:#252728">one small task at a time.</text>
<text x="40" y="978" font-size="13" class="label" text-anchor="start" style="fill:#252728">02 / PREFERENCES</text>

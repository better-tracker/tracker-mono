<text x="174.25" y="1613" font-size="11.5" class="label" text-anchor="middle" style="fill:#252728">PROJECTS</text>
<text x="263.75" y="1613" font-size="11.5" class="label" text-anchor="middle" style="fill:#252728">TASKS</text>
<rect x="308.5" y="1580" width="89.5" height="56" fill="#2F6F6D"/>

<rect x="40" y="270" width="90" height="90" fill="#C47C8A"/>
<text x="85" y="332" font-size="46" class="display" text-anchor="middle" style="fill:#252728">BM</text>
<text x="150" y="302" font-size="26" class="body" text-anchor="start" style="fill:#252728">Ben Morgan</text>
<rect x="150" y="318" width="248" height="48" fill="#F2E9D8" stroke="#2F6F6D" stroke-width="1.5"/>
<text x="274.0" y="347.0" font-size="12" class="label" text-anchor="middle" style="fill:#252728">EDIT AVATAR ↗</text>

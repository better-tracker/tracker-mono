<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — web subtask creation — minimal brutalist palette</title>
<desc id="desc">Full-screen creation page with an editable form and a contextual side panel. The parent task and inherited project are visible; an optional earlier deadline and separate assignee can be set. Black text and neutral surfaces throughout. Terracotta marks urgency, sage marks completion, slate blue marks work in progress, and a small mustard marker identifies the next-task section. No decorative colour fills.</desc>

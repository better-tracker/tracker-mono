<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — web subtask creation — earthy palette</title>
<desc id="desc">Full-screen creation page with an editable form and a contextual side panel. The parent task and inherited project are visible; an optional earlier deadline and separate assignee can be set. Cream surfaces, teal actions, plum headings, sage context, slate status labels, terracotta alerts, mustard focus panels and dusty rose profile identity.</desc>

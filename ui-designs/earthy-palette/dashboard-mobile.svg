<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1860" viewBox="0 0 430 1860" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — mobile today dashboard — earthy palette</title>
<desc id="desc">Mobile dashboard prioritizing current deadlines. A compact today signal leads to task creation, two overdue items, and a three-item deadline ledger. Next-task context and project progress follow. Persistent bottom navigation is represented at the end of the scroll canvas. Cream surfaces, teal actions, plum headings, sage context, slate status labels, terracotta alerts, mustard focus panels and dusty rose profile identity.</desc>

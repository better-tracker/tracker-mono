<rect x="40" y="1075" width="358" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>
<text x="56" y="1109.0" font-size="19" class="body" text-anchor="start" style="fill:#000000">11:00</text>
<path d="M 366 1100.0 l 7 7 l 7 -7" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="40" y="1186" font-size="13" class="label" text-anchor="start" style="fill:#000000">SUBTASKS / 02 DRAFTS</text>
<rect x="40" y="1208" width="358" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1"/>
<text x="54" y="1243" font-size="13" class="label" text-anchor="start" style="fill:#000000">01</text>
<text x="91" y="1243" font-size="18" class="body" text-anchor="start" style="fill:#000000">Audit desktop layout</text>
<text x="375" y="1244" font-size="24" class="body" text-anchor="middle" style="fill:#000000">×</text>
<rect x="40" y="1270" width="358" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1"/>
<text x="54" y="1305" font-size="13" class="label" text-anchor="start" style="fill:#000000">02</text>
<text x="91" y="1305" font-size="18" class="body" text-anchor="start" style="fill:#000000">Review empty states</text>
<text x="375" y="1306" font-size="24" class="body" text-anchor="middle" style="fill:#000000">×</text>
<rect x="40" y="1346" width="358" height="52" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>
<text x="219.0" y="1377.0" font-size="14" class="label" text-anchor="middle" style="fill:#000000">+ ADD SUBTASK</text>
<text x="40" y="1432" font-size="17" class="body" text-anchor="start" style="fill:#000000">Save once. Keep every step together.</text>
<rect x="40" y="1476" width="358" height="60" fill="#FCFCFA" stroke="#000000" stroke-width="3"/>
<text x="219.0" y="1511.0" font-size="15" class="label" text-anchor="middle" style="fill:#000000">CREATE TASK →</text>
<rect x="40" y="1552" width="358" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>
<text x="219.0" y="1585.0" font-size="14" class="label" text-anchor="middle" style="fill:#000000">CANCEL</text>
</svg>

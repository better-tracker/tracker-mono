<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1670" viewBox="0 0 430 1670" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — mobile task creation — minimal brutalist palette</title>
<desc id="desc">Single-column full-screen creation flow with labeled inputs and bottom actions. Project, assignee, deadline and editable subtask drafts appear in reading order. Black text and neutral surfaces throughout. Terracotta marks urgency, sage marks completion, slate blue marks work in progress, and a small mustard marker identifies the next-task section. No decorative colour fills.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#000000}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>
<rect x="0" y="0" width="430" height="1670" fill="#000000"/>
<rect x="4" y="12" width="2" height="1646" fill="#FCFCFA"/>
<rect x="9" y="12" width="3" height="174" fill="#FCFCFA"/>
<rect x="14" y="12" width="2" height="1646" fill="#FCFCFA"/>
<rect x="9" y="340" width="3" height="1316" fill="#FCFCFA"/>
<rect x="18" y="10" width="402" height="1650" fill="#FCFCFA"/>
<text x="40" y="43" font-size="13" class="label" text-anchor="start" style="fill:#000000">PROJECT TRACKER</text>
<text x="398" y="43" font-size="13" class="label" text-anchor="end" style="fill:#000000">BM</text>
<line x1="40" y1="61" x2="398" y2="61" stroke="#000000" stroke-width="2"/>
<text x="40" y="98" font-size="13" class="label" text-anchor="start" style="fill:#000000">← TASKS</text>
<text x="38" y="165" font-size="60" class="display" text-anchor="start" style="fill:#000000">NEW TASK.</text>
<text x="40" y="201" font-size="13" class="label" text-anchor="start" style="fill:#000000">INTERFACE SYSTEM / CREATE</text>
<rect x="40" y="224" width="358" height="16" fill="#000000"/>
<text x="40" y="278" font-size="13" class="label" text-anchor="start" style="fill:#000000">01 / TASK DETAILS</text>
<text x="398" y="278" font-size="12" class="label" text-anchor="end" style="fill:#000000">* REQUIRED</text>
<text x="40" y="321" font-size="14" class="label" text-anchor="start" style="fill:#000000">TASK TITLE *</text>
<rect x="40" y="335" width="358" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>
<text x="56" y="369.0" font-size="19" class="body" text-anchor="start" style="fill:#000000">Review dashboard wireframes</text>
<text x="40" y="437" font-size="14" class="label" text-anchor="start" style="fill:#000000">PROJECT *</text>
<rect x="40" y="451" width="358" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>
<text x="56" y="485.0" font-size="19" class="body" text-anchor="start" style="fill:#000000">Interface system</text>
<path d="M 366 476.0 l 7 7 l 7 -7" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="40" y="553" font-size="14" class="label" text-anchor="start" style="fill:#000000">ASSIGNED TO</text>
<rect x="40" y="567" width="358" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>
<text x="56" y="601.0" font-size="19" class="body" text-anchor="start" style="fill:#000000">Ben Morgan</text>
<path d="M 366 592.0 l 7 7 l 7 -7" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="40" y="669" font-size="14" class="label" text-anchor="start" style="fill:#000000">DESCRIPTION</text>
<rect x="40" y="683" width="358" height="96" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>
<text x="56" y="715" font-size="19" class="body" text-anchor="start" style="fill:#000000">Review layout and hierarchy.</text>
<text x="56" y="740" font-size="18" class="body" text-anchor="start" style="fill:#000000">Check accessibility on all devices.</text>
<text x="40" y="829" font-size="14" class="label" text-anchor="start" style="fill:#000000">PRIORITY</text>
<rect x="40" y="843" width="358" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1.5"/>
<rect x="56" y="867.0" width="8" height="8" fill="#E07A47"/>
<text x="74" y="877.0" font-size="19" class="body" text-anchor="start" style="fill:#000000">High</text>

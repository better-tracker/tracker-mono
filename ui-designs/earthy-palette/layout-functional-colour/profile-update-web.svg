<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1300" viewBox="0 0 1440 1300" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — functional colour profile-update-web</title>
<desc id="desc">Horizontal identity header and grouped personal details and preferences. Persistent field labels, explicit save and no left rail. Functional palette sampled from the provided reference: Dawn urgent/overdue, Greenery complete, Sea in progress, Sand next deadline. Login and profile are monochrome. Colours never style generic actions or decorative form sections.</desc>

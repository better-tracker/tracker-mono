<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — functional colour login-web</title>
<desc id="desc">Centered full-screen login with black text, labeled fields and no decorative left rail. Functional palette sampled from the provided reference: Dawn urgent/overdue, Greenery complete, Sea in progress, Sand next deadline. Login and profile are monochrome. Colours never style generic actions or decorative form sections.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#000000}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>
<rect x="0" y="0" width="1440" height="1100" fill="#FCFCFA" />
<g id="functional-task-states" /><text x="56" y="49" font-size="14" class="label" text-anchor="start" fill="#000000">PROJECT TRACKER</text>
<text x="1384" y="49" font-size="12" class="label" text-anchor="end" fill="#000000">001</text>
<line x1="56" y1="78" x2="1384" y2="78" stroke="#000000" stroke-width="2" />
<text x="720" y="149" font-size="12" class="label" text-anchor="middle" fill="#000000">01 / YOUR ACCOUNT</text>
<text x="720" y="249" font-size="96" class="display" text-anchor="middle" fill="#000000">WELCOME BACK.</text>
<text x="720" y="301" font-size="23" class="body" text-anchor="middle" fill="#000000">Your work, in order. Sign in to find your next step.</text>
<line x1="430" y1="346" x2="1010" y2="346" stroke="#000000" stroke-width="2" />
<text x="430" y="402" font-size="12" class="label" text-anchor="start" fill="#000000">EMAIL ADDRESS</text>
<rect x="430" y="418" width="580" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1.5" />
<text x="446" y="449" font-size="18" class="body" text-anchor="start" fill="#000000">ben@example.com</text>
<text x="430" y="515" font-size="12" class="label" text-anchor="start" fill="#000000">PASSWORD</text>
<rect x="430" y="531" width="580" height="56" fill="#FCFCFA" stroke="#000000" stroke-width="1.5" />
<text x="446" y="562" font-size="18" class="body" text-anchor="start" fill="#000000">••••••••••••</text>
<rect x="909" y="533" width="99" height="52" fill="#FCFCFA" stroke="#000000" stroke-width="1.5" />
<text x="958.5" y="564.0" font-size="13" class="label" text-anchor="middle" fill="#000000">SHOW</text>
<rect x="430" y="613" width="22" height="22" fill="#FCFCFA" stroke="#000000" stroke-width="1.5" />
<text x="466" y="630" font-size="18" class="body" text-anchor="start" fill="#000000">Keep me signed in</text>
<text x="1010" y="630" font-size="18" class="body" text-anchor="end" fill="#000000">Forgot password?</text>
<line x1="862" y1="638" x2="1010" y2="638" stroke="#000000" stroke-width="1" />
<rect x="430" y="685" width="580" height="64" fill="#FCFCFA" stroke="#000000" stroke-width="3" />
<text x="720.0" y="722.0" font-size="13" class="label" text-anchor="middle" fill="#000000">SIGN IN →</text>
<text x="720" y="802" font-size="20" class="body" text-anchor="middle" fill="#000000">New here? Create account ↗</text>
<line x1="56" y1="891" x2="1384" y2="891" stroke="#000000" stroke-width="2" />
<text x="56" y="940" font-size="12" class="label" text-anchor="start" fill="#000000">01</text>
<text x="100" y="940" font-size="22" class="body" text-anchor="start" fill="#000000">Find what matters.</text>
<text x="522" y="940" font-size="12" class="label" text-anchor="start" fill="#000000">02</text>
<text x="566" y="940" font-size="22" class="body" text-anchor="start" fill="#000000">Break it into steps.</text>
<text x="988" y="940" font-size="12" class="label" text-anchor="start" fill="#000000">03</text>
<text x="1032" y="940" font-size="22" class="body" text-anchor="start" fill="#000000">Move work forward.</text>
<line x1="56" y1="1025" x2="1384" y2="1025" stroke="#000000" stroke-width="2" />
<text x="56" y="1059" font-size="12" class="label" text-anchor="start" fill="#000000">ACCOUNT / SIGN IN</text>
<text x="1384" y="1059" font-size="12" class="label" text-anchor="end" fill="#000000">PLAN SMALL. FINISH WELL.</text>
</svg>
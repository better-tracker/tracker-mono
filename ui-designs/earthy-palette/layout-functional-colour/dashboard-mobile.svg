<title id="title">Project Tracker — functional colour dashboard-mobile</title>
<desc id="desc">Next deadline leads the layout; overdue tasks and a deadline-ordered task list follow. Status is conveyed with words and sparse colour markers; no left rail. Functional palette sampled from the provided reference: Dawn urgent/overdue, Greenery complete, Sea in progress, Sand next deadline. Login and profile are monochrome. Colours never style generic actions or decorative form sections.</desc>

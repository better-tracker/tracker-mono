<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — functional colour task-create-web</title>
<desc id="desc">Full-screen creation with top context, persistent input labels and explicit save. Desktop task and subtask drafts share columns; mobile stacks steps. No left rail. Functional palette sampled from the provided reference: Dawn urgent/overdue, Greenery complete, Sea in progress, Sand next deadline. Login and profile are monochrome. Colours never style generic actions or decorative form sections.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#000000}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>
<rect x="0" y="0" width="1440" height="1240" fill="#FCFCFA" />

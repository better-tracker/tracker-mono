<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — balanced earthy subtask-create-web</title>
<desc id="desc">Full-screen creation with top context, persistent input labels and explicit save. Desktop task and subtask drafts share columns; mobile stacks steps. No left rail. Balanced earthy variant: cream context surfaces, translucent slate and terracotta panels, sage completed states, and mustard primary actions. Typography remains black; layouts are unchanged.</desc>

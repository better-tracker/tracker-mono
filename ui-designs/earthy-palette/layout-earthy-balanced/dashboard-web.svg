<title id="title">Project Tracker — balanced earthy dashboard-web</title>
<desc id="desc">Next deadline leads the layout; overdue tasks and a deadline-ordered task list follow. Status is conveyed with words and sparse colour markers; no left rail. Balanced earthy variant: cream context surfaces, translucent slate and terracotta panels, sage completed states, and mustard primary actions. Typography remains black; layouts are unchanged.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — web login — earthy palette</title>
<desc id="desc">Full-screen sign-in page. Editorial typography and a sage brand panel on the left; labeled email and password fields on the right. Password visibility, recovery, remember-me and sign-up actions are shown. Cream surfaces, teal actions, plum headings, sage context, slate status labels, terracotta alerts, mustard focus panels and dusty rose profile identity.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#252728}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>
<rect x="0" y="0" width="1600" height="1040" fill="#252728"/>
<rect x="7" y="20" width="3" height="1000" fill="#F2E9D8"/>
<rect x="16" y="20" width="5" height="186" fill="#F2E9D8"/>
<rect x="23" y="20" width="2" height="1000" fill="#F2E9D8"/>
<rect x="33" y="20" width="7" height="402" fill="#F2E9D8"/>
<rect x="45" y="20" width="3" height="1000" fill="#F2E9D8"/>
<rect x="55" y="20" width="6" height="178" fill="#F2E9D8"/>
<rect x="12" y="380" width="3" height="310" fill="#F2E9D8"/>
<rect x="31" y="520" width="4" height="500" fill="#F2E9D8"/>
<rect x="53" y="668" width="6" height="352" fill="#F2E9D8"/>
<rect x="64" y="18" width="1518" height="1004" fill="#F2E9D8"/>
<text x="104" y="57" font-size="14" class="label" text-anchor="start" style="fill:#252728">PROJECT TRACKER / 001</text>
<text x="1540" y="57" font-size="14" class="label" text-anchor="end" style="fill:#252728">YOUR WORK. IN ORDER.</text>
<line x1="104" y1="78" x2="1540" y2="78" stroke="#252728" stroke-width="2"/>
<g id="brand-panel">
<text x="104" y="127" font-size="14" class="label" text-anchor="start" style="fill:#252728">01 / A LITTLE SPACE TO FOCUS</text>
<text x="93" y="280" font-size="125" class="display" text-anchor="start" style="fill:#5B3A62">MAKE</text>
<text x="93" y="405" font-size="125" class="display" text-anchor="start" style="fill:#5B3A62">ROOM FOR</text>
<text x="93" y="530" font-size="125" class="display" text-anchor="start" style="fill:#5B3A62">WORK.</text>
<text x="104" y="594" font-size="28" class="body" text-anchor="start" style="fill:#252728">Less noise. A clearer next step.</text>
<rect x="104" y="640" width="684" height="232" fill="#8FA68F"/>
<text x="128" y="674" font-size="14" class="label" text-anchor="start" style="fill:#252728">THE DAILY ROUTINE</text>
<text x="128" y="725" font-size="19" class="label" text-anchor="start" style="fill:#252728">01</text>
<text x="184" y="725" font-size="24" class="body" text-anchor="start" style="fill:#252728">Find what matters.</text>
<line x1="128" y1="742" x2="764" y2="742" stroke="#252728" stroke-width="1"/>
<text x="128" y="779" font-size="19" class="label" text-anchor="start" style="fill:#252728">02</text>
<text x="184" y="779" font-size="24" class="body" text-anchor="start" style="fill:#252728">Break it into smaller steps.</text>
<line x1="128" y1="796" x2="764" y2="796" stroke="#252728" stroke-width="1"/>
<text x="128" y="833" font-size="19" class="label" text-anchor="start" style="fill:#252728">03</text>
<text x="184" y="833" font-size="24" class="body" text-anchor="start" style="fill:#252728">Move one thing forward.</text>
</g>
<line x1="848" y1="118" x2="848" y2="888" stroke="#D6CDBE" stroke-width="1"/>
<g id="sign-in-form">
<text x="924" y="151" font-size="14" class="label" text-anchor="start" style="fill:#252728">02 / YOUR ACCOUNT</text>
<text x="917" y="249" font-size="77" class="display" text-anchor="start" style="fill:#5B3A62">WELCOME</text>
<text x="917" y="326" font-size="77" class="display" text-anchor="start" style="fill:#5B3A62">BACK.</text>
<text x="924" y="373" font-size="21" class="body" text-anchor="start" style="fill:#252728">Sign in to pick up where you left off.</text>
<text x="924" y="424" font-size="14" class="label" text-anchor="start" style="fill:#252728">EMAIL ADDRESS</text>
<rect x="924" y="438" width="548" height="56" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="940" y="472.0" font-size="19" class="body" text-anchor="start" style="fill:#252728">ben@example.com</text>
<text x="924" y="540" font-size="14" class="label" text-anchor="start" style="fill:#252728">PASSWORD</text>
<rect x="924" y="554" width="548" height="56" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="940" y="588.0" font-size="19" class="body" text-anchor="start" style="fill:#252728">••••••••••••</text>
<rect x="1372" y="555" width="99" height="54" fill="#F2E9D8" stroke="#2F6F6D" stroke-width="1.5"/>
<text x="1421.5" y="587.0" font-size="12" class="label" text-anchor="middle" style="fill:#252728">SHOW</text>
<rect x="924" y="644" width="22" height="22" fill="#2F6F6D" stroke="#2F6F6D" stroke-width="1.5"/>
<path d="M 929 655 l 5 5 l 8 -10" fill="none" stroke="#F2E9D8" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="960" y="661" font-size="18" class="body" text-anchor="start" style="fill:#252728">Keep me signed in</text>
<text x="1472" y="661" font-size="18" class="body" text-anchor="end" style="fill:#252728">Forgot password?</text>
<line x1="1325" y1="668" x2="1472" y2="668" stroke="#252728" stroke-width="1"/>
<rect x="924" y="712" width="548" height="64" fill="#2F6F6D" stroke="#2F6F6D" stroke-width="1.5"/>
<text x="1198.0" y="749.0" font-size="16" class="label" text-anchor="middle" style="fill:#F2E9D8">SIGN IN →</text>
<text x="924" y="827" font-size="19" class="body" text-anchor="start" style="fill:#252728">New to Project Tracker?</text>
<text x="1472" y="827" font-size="19" class="body" text-anchor="end" style="fill:#252728">Create account ↗</text>
<line x1="1330" y1="834" x2="1472" y2="834" stroke="#252728" stroke-width="1"/>
</g>
<line x1="104" y1="970" x2="1540" y2="970" stroke="#252728" stroke-width="2"/>
<text x="104" y="1002" font-size="13" class="label" text-anchor="start" style="fill:#252728">ACCOUNT / SIGN IN</text>
<text x="1540" y="1002" font-size="13" class="label" text-anchor="end" style="fill:#252728">PLAN SMALL. FINISH WELL.</text>
</svg>

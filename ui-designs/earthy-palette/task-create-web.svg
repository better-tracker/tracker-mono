<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — web task creation — earthy palette</title>
<desc id="desc">Full-screen creation page with an editable form and a contextual side panel. The form includes task title, project, description, assignee, priority, deadline and two editable subtask drafts. Cream surfaces, teal actions, plum headings, sage context, slate status labels, terracotta alerts, mustard focus panels and dusty rose profile identity.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#252728}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>

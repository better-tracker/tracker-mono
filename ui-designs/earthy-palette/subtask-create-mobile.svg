<rect x="40" y="1108" width="358" height="56" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="56" y="1142.0" font-size="19" class="body" text-anchor="start" style="fill:#252728">10:30</text>
<path d="M 366 1133.0 l 7 7 l 7 -7" fill="none" stroke="#252728" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="40" y="1206" font-size="16" class="body" text-anchor="start" style="fill:#4E5650">Finish before the parent deadline:</text>
<text x="40" y="1230" font-size="16" class="body" text-anchor="start" style="fill:#4E5650">today, 11:00.</text>
<rect x="40" y="1280" width="358" height="60" fill="#2F6F6D" stroke="#2F6F6D" stroke-width="1.5"/>
<text x="219.0" y="1315.0" font-size="14" class="label" text-anchor="middle" style="fill:#F2E9D8">CREATE SUBTASK →</text>
<rect x="40" y="1356" width="358" height="56" fill="#F2E9D8" stroke="#2F6F6D" stroke-width="1.5"/>
<text x="219.0" y="1389.0" font-size="14" class="label" text-anchor="middle" style="fill:#252728">CANCEL</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1520" viewBox="0 0 390 1520" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — alternate subtask-create mobile</title>
<desc id="desc">Full-screen creation with top context, persistent input labels and explicit save. Desktop task and subtask drafts share columns; mobile stacks steps. No left rail.</desc>

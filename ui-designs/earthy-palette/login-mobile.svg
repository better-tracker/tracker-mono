<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1020" viewBox="0 0 430 1020" role="img" aria-labelledby="title desc">
<title id="title">Project Tracker — mobile login — earthy palette</title>
<desc id="desc">Full-screen mobile sign-in page with persistent field labels, password visibility, remember-me, password recovery, and a full-width sign-in button. The barcode rail is reduced to preserve form space. Cream surfaces, teal actions, plum headings, sage context, slate status labels, terracotta alerts, mustard focus panels and dusty rose profile identity.</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#252728}.display{font-weight:400;letter-spacing:-.06em}.label{font-weight:600;letter-spacing:.08em}.body{font-weight:400;letter-spacing:-.02em}</style>
<rect x="0" y="0" width="430" height="1020" fill="#252728"/>
<rect x="4" y="12" width="2" height="996" fill="#F2E9D8"/>
<rect x="9" y="12" width="3" height="174" fill="#F2E9D8"/>
<rect x="14" y="12" width="2" height="996" fill="#F2E9D8"/>
<rect x="9" y="340" width="3" height="666" fill="#F2E9D8"/>
<rect x="18" y="10" width="402" height="1000" fill="#F2E9D8"/>
<text x="40" y="43" font-size="13" class="label" text-anchor="start" style="fill:#252728">PROJECT TRACKER</text>
<text x="398" y="43" font-size="13" class="label" text-anchor="end" style="fill:#252728">001</text>
<line x1="40" y1="61" x2="398" y2="61" stroke="#252728" stroke-width="2"/>
<text x="40" y="98" font-size="13" class="label" text-anchor="start" style="fill:#252728">01 / YOUR ACCOUNT</text>
<text x="37" y="179" font-size="66" class="display" text-anchor="start" style="fill:#5B3A62">WELCOME</text>
<text x="37" y="244" font-size="66" class="display" text-anchor="start" style="fill:#5B3A62">BACK.</text>
<text x="40" y="285" font-size="20" class="body" text-anchor="start" style="fill:#252728">A clearer next step starts here.</text>
<rect x="40" y="316" width="358" height="16" fill="#5B3A62"/>
<text x="40" y="379" font-size="14" class="label" text-anchor="start" style="fill:#252728">EMAIL ADDRESS</text>
<rect x="40" y="393" width="358" height="56" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="56" y="427.0" font-size="19" class="body" text-anchor="start" style="fill:#252728">ben@example.com</text>
<text x="40" y="495" font-size="14" class="label" text-anchor="start" style="fill:#252728">PASSWORD</text>
<rect x="40" y="509" width="358" height="56" fill="#F2E9D8" stroke="#252728" stroke-width="1.5"/>
<text x="56" y="543.0" font-size="19" class="body" text-anchor="start" style="fill:#252728">••••••••••</text>
<rect x="298" y="510" width="99" height="54" fill="#F2E9D8" stroke="#2F6F6D" stroke-width="1.5"/>
<text x="347.5" y="542.0" font-size="12" class="label" text-anchor="middle" style="fill:#252728">SHOW</text>
<rect x="40" y="596" width="22" height="22" fill="#2F6F6D" stroke="#2F6F6D" stroke-width="1.5"/>
<path d="M 45 607 l 5 5 l 8 -10" fill="none" stroke="#F2E9D8" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="77" y="613" font-size="18" class="body" text-anchor="start" style="fill:#252728">Keep me signed in</text>
<text x="40" y="666" font-size="18" class="body" text-anchor="start" style="fill:#252728">Forgot password?</text>
<line x1="40" y1="674" x2="187" y2="674" stroke="#252728" stroke-width="1"/>
<rect x="40" y="711" width="358" height="60" fill="#2F6F6D" stroke="#2F6F6D" stroke-width="1.5"/>
<text x="219.0" y="746.0" font-size="15" class="label" text-anchor="middle" style="fill:#F2E9D8">SIGN IN →</text>
<text x="40" y="814" font-size="18" class="body" text-anchor="start" style="fill:#252728">New here?</text>
<text x="398" y="814" font-size="18" class="body" text-anchor="end" style="fill:#252728">Create account ↗</text>
<rect x="40" y="858" width="358" height="96" fill="#8FA68F"/>
<text x="56" y="890" font-size="16" class="label" text-anchor="start" style="fill:#252728">MAKE ROOM FOR WORK.</text>
<text x="56" y="926" font-size="19" class="body" text-anchor="start" style="fill:#252728">Plan small. Finish well.</text>
</svg>
